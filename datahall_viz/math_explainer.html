<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack Grouping Math Explainer</title>
<style>
:root{
  --bg:#0a0b0d; --panel:#121418; --panel2:#171a1f; --line:#262a31; --line2:#333843;
  --text:#e8eaed; --mute:#8b919c; --dim:#5b616c;
  --amber:#f5a524; --teal:#2dd4bf; --sky:#60a5fa; --rose:#fb7185; --lime:#a3e635; --violet:#a78bfa;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 70% -10%,#16181d 0%,transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/48px 48px,
    var(--bg);
  color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;
}
header{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(10,11,13,.8);backdrop-filter:blur(6px)}
.brand{font-weight:700;letter-spacing:.04em;font-size:15px;color:var(--amber);white-space:nowrap}
.brand small{color:var(--mute);font-weight:500;margin-left:8px;letter-spacing:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mute);font:600 14px var(--sans);padding:8px 14px;border-radius:8px;cursor:pointer;transition:.2s}
nav button:hover{color:var(--text);background:var(--panel)}
nav button.on{color:var(--text);background:var(--panel2);border-color:var(--line2)}
nav button b{color:var(--amber);margin-right:6px;font-family:var(--mono)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:20px;padding:20px 28px}
.module{display:none;grid-column:1/3;grid-template-columns:subgrid;gap:20px;min-height:0}
.module.on{display:grid}
.stagewrap{display:flex;flex-direction:column;gap:14px;min-height:0}
.stage{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--mute)}
.controls label{display:flex;align-items:center;gap:8px}
.controls output{color:var(--text);font-family:var(--mono);min-width:44px}
.controls button,.controls select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;font:600 13px var(--sans);cursor:pointer}
.controls button:hover{border-color:var(--amber)}
.controls button.on{background:var(--amber);color:#111;border-color:var(--amber)}
input[type=range]{accent-color:var(--amber);width:150px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;overflow:auto;display:flex;flex-direction:column;gap:6px}
aside h2{font-size:22px;margin-bottom:2px}
aside .sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.line{opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s;max-height:0;overflow:hidden;font-size:16px;line-height:1.6;border-left:3px solid var(--line2);padding-left:14px;margin:0}
.line.on{opacity:1;transform:none;max-height:600px;margin:7px 0}
.line.cur{border-left-color:var(--amber)}
.line.flash{animation:flash .6s}
@keyframes flash{from{background:rgba(245,165,36,.18)}to{background:transparent}}
.f{font-family:var(--mono);color:var(--amber)}
.v{font-family:var(--mono);color:var(--text);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.note{color:var(--mute);font-size:14px}
.big{font-size:28px;font-family:var(--mono);font-weight:700;color:var(--amber)}
footer{display:flex;align-items:center;gap:18px;padding:12px 28px;border-top:1px solid var(--line);background:rgba(10,11,13,.8)}
footer button{background:var(--panel2);border:1px solid var(--line2);color:var(--text);font:600 14px var(--sans);padding:9px 18px;border-radius:9px;cursor:pointer}
footer button:hover{border-color:var(--amber)}
.dots{display:flex;gap:8px;flex:1;justify-content:center;align-items:center}
.dots span{font-size:12px;color:var(--dim);padding:5px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;transition:.2s}
.dots span.done{color:var(--mute);border-color:var(--line2)}
.dots span.cur{background:var(--amber);color:#111;border-color:var(--amber);font-weight:700}
.hint{color:var(--dim);font-size:12px;white-space:nowrap}
/* SVG hall */
svg text{font-family:var(--sans)}
.rack rect.body{transition:fill .4s,stroke .4s,fill-opacity .4s;cursor:pointer}
.rack:hover rect.body{stroke:var(--amber)!important}
.rack text{pointer-events:none}
.cut{opacity:0;transition:opacity .35s}
.cut.on{opacity:1}
.cut line{stroke:var(--amber);stroke-width:3;stroke-dasharray:8 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.hit{fill:transparent;cursor:pointer}
.hit:hover+.ghost{opacity:.6}
.ghost{stroke:var(--amber);stroke-width:2;stroke-dasharray:3 6;opacity:0;transition:.2s;pointer-events:none}
.pill{transition:opacity .4s}
/* pipeline */
.pipe{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.card{flex:1;min-width:130px;max-width:210px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px 14px;opacity:.12;transform:translateY(10px) scale(.97);transition:.5s}
.card.on{opacity:1;transform:none}
.card.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 8px 30px rgba(245,165,36,.12)}
.card .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.card .n{font:700 28px var(--mono);margin:6px 0 2px}
.card .u{font-size:13px;color:var(--mute)}
.arrow{align-self:center;color:var(--dim);font-size:20px}
/* ups blocks */
.blocks{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.brow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.brow .tag{width:84px;font-size:12px;color:var(--mute)}
.unit{width:54px;height:62px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px var(--mono);color:var(--dim);opacity:0;transform:scale(.6);transition:.4s}
.unit.on{opacity:1;transform:none}
.unit.act{background:rgba(245,165,36,.16);border-color:var(--amber);color:var(--amber)}
.unit.spare{background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal);border-style:dashed}
.unit i{display:block;width:26px;height:3px;background:currentColor;opacity:.5;margin:2px 0;border-radius:2px}
.util{margin-top:20px;opacity:0;transition:.5s}
.util.on{opacity:1}
.bar{height:14px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .6s}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px;opacity:0;transition:.5s}
.chips.on{opacity:1}
.chip{font:600 14px var(--mono);padding:8px 12px;border-radius:8px;border:1px solid var(--line2);color:var(--dim);transition:.4s}
.chip.low{color:var(--mute);background:var(--panel2)}
.chip.pick{background:var(--amber);color:#111;border-color:var(--amber);transform:scale(1.2);box-shadow:0 0 24px rgba(245,165,36,.4)}
.chip.mark{border-color:var(--teal);color:var(--teal)}
/* binary */
.bits{display:flex;gap:10px;justify-content:center}
.bit{width:92px;text-align:center}
.bit .w{height:22px;font:600 14px var(--mono);color:var(--mute);opacity:0;transition:.4s}
.bit .w.on{opacity:1}
.bit button{width:92px;height:116px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);font:700 54px var(--mono);cursor:pointer;transition:.25s;margin:8px 0}
.bit button.one{background:rgba(245,165,36,.16);border-color:var(--amber);color:var(--amber);box-shadow:0 0 28px rgba(245,165,36,.2)}
.bit button:hover{transform:translateY(-3px)}
.bit .c{height:24px;font:600 15px var(--mono);color:var(--text);opacity:0;transition:.4s}
.bit .c.on{opacity:1}
.bit .p{font-size:11px;color:var(--dim);font-family:var(--mono)}
.sumrow{margin-top:26px;text-align:center;opacity:0;transition:.5s}
.sumrow.on{opacity:1}
.sumrow .big{font-size:56px}
@media (max-width:1100px){main{grid-template-columns:1fr}.module{grid-column:1}}
/* ---- math explainer additions ---- */
.stage.top{justify-content:flex-start;overflow:auto}
.blocksrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:6px 0 18px}
.bk{width:26px;height:34px;border-radius:5px;border:1px solid rgba(255,255,255,.12);transition:background .5s,transform .3s;display:flex;align-items:flex-end;justify-content:center;font:600 9px var(--mono);color:rgba(0,0,0,.6);padding-bottom:2px}
.bk.cutafter{margin-right:14px;position:relative}
.bk.cutafter::after{content:"";position:absolute;right:-10px;top:-6px;bottom:-6px;border-right:3px dashed var(--amber)}
.lbar{display:grid;grid-template-columns:230px 1fr 150px;gap:12px;align-items:center;margin:9px 0;font-size:14px;opacity:0;transform:translateX(-10px);transition:.5s}
.lbar.on{opacity:1;transform:none}
.lbar .t{color:var(--mute)}.lbar .t b{color:var(--text)}
.lbar .tr{height:16px;background:var(--panel2);border-radius:8px;overflow:hidden}
.lbar .tr div{height:100%;border-radius:8px;transition:width .8s}
.lbar .num{font:600 13px var(--mono);text-align:right}
.mat{border-collapse:separate;border-spacing:3px;margin:0 auto}
.mat th{font:600 12px var(--mono);color:var(--mute);padding:2px 6px;text-align:center}
.mat td{text-align:center;font:700 15px var(--mono);min-width:44px;height:34px;border-radius:6px;background:var(--panel2);color:var(--dim);transition:.3s}
.mat td.lab{background:none;color:var(--mute);font-size:13px;text-align:right;padding-right:8px}
.mat td.kw{text-align:left;min-width:190px;padding:0;background:none}
.kwbar{height:30px;border-radius:6px;background:#2a2e36;color:#111;font:700 13px var(--mono);display:flex;align-items:center;padding-left:8px;transition:width .4s,background .4s;white-space:nowrap}
.mat td.t1{background:rgba(245,165,36,.18);color:var(--amber);cursor:pointer}
.mat td.t0{cursor:pointer}
.mat td.fx{opacity:.4;cursor:default}
.mat td.bad{outline:2px solid var(--rose);background:rgba(251,113,133,.22);color:var(--rose)}
.mat td.cutrow{border-bottom:0}
.mat tr.cutline td{box-shadow:0 5px 0 -3px var(--amber)}
.mat td.hid,.mat th.hid{display:none}
.mat td.ysum{background:none;font-size:14px}
.sep{width:14px}
.heat td{min-width:62px;height:40px;font-size:13px}
.heat td.max{outline:2px solid var(--amber);color:#fff}
.heat td.diag{background:#0d0e10;color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.gcard{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--panel2);transition:.4s}
.gcard.hot{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.gcard h4{font-size:14px;margin-bottom:8px}
.tagr{font-size:12px;color:var(--mute);margin-top:6px}
.fc{display:flex;flex-direction:column;gap:6px;align-items:stretch;margin:6px 0}
.fcb{border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--mute);background:var(--panel2);transition:.3s}
.fcb.hit{color:var(--text);border-color:var(--amber);background:rgba(245,165,36,.1)}
.fcb.end{background:var(--amber);color:#111;font-weight:700}
.fcb.endp{background:#3a3f49;color:#fff}
.fcb.endg{background:#16a34a;color:#fff}
.fcarrow{text-align:center;color:var(--dim);font-size:12px;line-height:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stat div{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.stat small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font:700 20px var(--mono)}
.gapbar{height:10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);overflow:hidden;margin:4px 0 10px}
.gapbar div{height:100%;background:var(--rose);transition:width .6s}
.badge{display:inline-block;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--teal);color:#06201c}
.tnode rect{transition:.4s}
.tmini{font:600 11px var(--mono);border-collapse:collapse;margin:6px 0}
.tmini td,.tmini th{padding:2px 7px;text-align:center;border:1px solid var(--line)}
.tmini td.fr{color:var(--amber);background:rgba(245,165,36,.12)}
.tmini td.bk2{outline:2px solid var(--rose)}
.dots{flex-wrap:wrap}
.dots span{padding:4px 8px}
svg .grid line{stroke:#22262d}
.small{font-size:13px;color:var(--mute)}

aside>*{flex-shrink:0}
.gcard .heat td{min-width:40px;height:34px;font-size:12px;padding:0 2px}
.gcard .heat th{padding:2px 2px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* ======== v2: formula strip, motion, new B&B visuals ======== */
.module{grid-template-rows:auto minmax(0,1fr)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.module.on>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
.module.on>*:nth-child(2){animation-delay:.08s}.module.on>*:nth-child(3){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){.module.on>*{animation:none}}
.fstrip{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 30px;
  background:linear-gradient(100deg,#13151a,#191c23 60%,#13151a);border:1px solid var(--line2);border-radius:16px;padding:7px 24px;
  font:italic 22px/1.45 "Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;color:#cfd3da;position:relative;overflow:hidden}
.fstrip::before{content:"FORMULA";position:absolute;left:14px;top:7px;font:700 9px var(--sans);letter-spacing:.18em;color:var(--dim);font-style:normal}
.fstrip.small{font-size:16px}
.term{opacity:.28;transition:opacity .6s,color .6s,text-shadow .6s,background .6s,transform .6s;padding:1px 10px;border-radius:10px;white-space:nowrap}
.term.seen{opacity:.78}
.term.cur{opacity:1;color:var(--amber);text-shadow:0 0 20px rgba(245,165,36,.5);background:rgba(245,165,36,.08);transform:scale(1.04)}
.term sub,.term sup{font-size:.62em;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;font-size:.86em;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 5px 1px}
.frac>span:last-child{padding:1px 5px 0}
.sumop{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1}
.sumop b{font-size:1.7em;font-weight:400;font-style:normal}
.sumop span{font-size:.55em;min-height:.8em}
.cases{display:inline-flex;align-items:center;vertical-align:middle}
.cases .brace{font-size:2.5em;font-weight:200;font-style:normal;line-height:1;margin-right:6px;color:inherit}
.cases .cb{display:flex;flex-direction:column;gap:2px;font-size:.86em;text-align:left}
/* search space blocks */
.bk{position:relative;margin-right:0;transition:background .6s,margin .5s}
.bk::after{content:"";position:absolute;right:-9px;top:-6px;bottom:-6px;border-right:3px dashed var(--amber);transform:scaleY(0);transition:transform .5s}
.bk.cutafter{margin-right:14px}
.bk.cutafter::after{transform:scaleY(1)}
/* failure page */
.lk line{fill:none;transition:opacity .6s,stroke .5s,stroke-width .5s}
.lk circle{transition:opacity .5s,fill .5s}
.lbl{transition:opacity .5s}
.lbl rect{fill:#0a0b0d;stroke:#333843;transition:stroke .5s}
.lbl text{font:12px ui-monospace,monospace;fill:#8b919c;transition:fill .5s}
.ups rect:first-child{fill:#171a1f;stroke:#333843;stroke-width:2;transition:fill .5s,stroke .5s}
.ups:hover rect:first-child{stroke:var(--amber)}
.ups.dead rect:first-child{fill:#2a1519;stroke:#fb7185}
.ups text{transition:fill .5s}
.ubar{fill:#f5a524;opacity:.28;transition:height .7s cubic-bezier(.2,.8,.2,1),y .7s cubic-bezier(.2,.8,.2,1)}
.heatwrap{max-height:0;opacity:0;overflow:hidden;transition:max-height .7s,opacity .7s}
.heatwrap.on{max-height:330px;opacity:1}
.heat td{transition:background .5s,box-shadow .4s}
.heat td.max{outline:2px solid var(--amber)}
/* branch and bound */
.stage.bbstage{overflow:hidden}
.treehost{width:100%;flex:1;min-height:0;display:flex}
.treehost svg{height:100%}
.lowrow{flex:none}
.lowrow{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-top:8px}
.card2{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.card2 h4{font-size:13px;margin-bottom:8px}
.card2 h4 small{color:var(--dim);font-weight:400;margin-left:8px}
.rks{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.rkw{text-align:center;font:600 11px var(--mono);color:var(--dim)}
.rk{position:relative;width:42px;height:60px;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;border:2px solid transparent;transition:box-shadow .4s,border-color .4s;margin-bottom:3px}
.rk .sg{width:100%;transition:height .9s cubic-bezier(.2,.8,.2,1);opacity:.92}
.rk b{position:absolute;inset:0;display:grid;place-items:center;font:700 12px var(--mono);color:#0a0b0d;text-shadow:0 0 5px rgba(255,255,255,.55)}
.rk.frac{border-color:rgba(255,255,255,.3)}
.rk.bk{border-color:var(--amber);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 16px rgba(245,165,36,.75)}50%{box-shadow:0 0 3px rgba(245,165,36,.2)}}
.rkleg{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute);margin-left:8px;align-self:center}
.rkleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.rcap,.bcap{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.35}
.bl{position:relative;height:42px;margin:24px 8px 16px;background:#1b1e24;border-radius:8px}
.zone{position:absolute;top:0;bottom:0;right:0;left:100%;background:repeating-linear-gradient(45deg,rgba(251,113,133,.16) 0 6px,rgba(251,113,133,.06) 6px 12px);border-radius:0 8px 8px 0;transition:left .9s cubic-bezier(.2,.8,.2,1),opacity .5s}
.ubl{position:absolute;top:-8px;bottom:-8px;width:0;border-left:3px solid var(--teal);transition:left .9s cubic-bezier(.2,.8,.2,1),opacity .5s}
.ubl span{position:absolute;top:-16px;left:-30px;font:700 11px var(--mono);color:var(--teal);white-space:nowrap}
.rootm{position:absolute;top:10px;bottom:10px;border-left:2px dashed #5b616c}
.rootm span{position:absolute;top:-14px;left:6px;font:600 10px var(--mono);color:#5b616c;white-space:nowrap}
.nmk{position:absolute;top:50%;transition:left 1s cubic-bezier(.2,.8,.2,1)}
.nmk i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--amber);box-shadow:0 0 16px rgba(245,165,36,.8);transition:background .4s,box-shadow .4s}
.nmk span{position:absolute;top:12px;left:-40px;font:700 11px var(--mono);color:var(--amber);white-space:nowrap;transition:color .4s}
.nmk.prn i{background:var(--rose);box-shadow:0 0 16px rgba(251,113,133,.8)}.nmk.prn span{color:var(--rose)}
.nmk.good i{background:var(--teal);box-shadow:0 0 16px rgba(45,212,191,.8)}.nmk.good span{color:var(--teal)}
.blax{display:flex;justify-content:space-between;font:600 10px var(--mono);color:var(--dim);margin:0 8px}
.tn{opacity:0;transition:transform .95s cubic-bezier(.2,.8,.2,1),opacity .6s}
.tn.vis{opacity:1}
.tn rect{fill:#121418;stroke:#333843;stroke-width:2;stroke-dasharray:4 4;transition:fill .5s,stroke .5s,stroke-width .3s}
.tn.done rect{stroke-dasharray:none}
.tn.st-branched rect{fill:#171a1f;stroke:var(--amber)}
.tn.st-incumbent rect{fill:#14352a;stroke:var(--teal)}
.tn.st-pruned rect{fill:#1b1d22;stroke:#5b616c}
.tn.st-infeasible rect{fill:#2a1519;stroke:var(--rose)}

<body>
<header>
  <div class="brand">GROUPING MATH<small>MILP explainer</small></div>

<footer>

  <button id="ctlbtn">&#9881; Controls</button>

<script>
if (/still/.test(location.search)) document.documentElement.classList.add('still');
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const fmt = (n, d = 1) => (+n.toFixed(d)).toLocaleString("en-US", { maximumFractionDigits: d });
const COLORS = ["#f5a524", "#2dd4bf", "#60a5fa", "#fb7185", "#a3e635", "#a78bfa"];
const comb = (n, k) => { n = BigInt(n); k = BigInt(k); if (k < 0n || k > n) return 0n; let r = 1n; for (let i = 1n; i <= k; i++) r = r * (n - k + i) / i; return r; };
const log10Big = b => { const t = b.toString(); return t.length - 1 + Math.log10(Number("0." + t.slice(0, 15)) * 10); };
const fmtBig = b => { const t = b.toString(); if (t.length <= 9) return Number(b).toLocaleString("en-US"); return `${t[0]}.${t.slice(1, 3)}&times;10<sup>${t.length - 1}</sup>`; };

function histBtn(aside) {
  const b = h("button", "histbtn", "Show earlier steps");
  b.onclick = () => { aside.classList.toggle("hist"); b.textContent = aside.classList.contains("hist") ? "Show current step only" : "Show earlier steps"; };
  return b;
}
function makePanel(title, sub, lines) {
  const aside = h("aside");
  aside.append(h("h2", null, title), h("div", "sub", sub), histBtn(aside));
  const els = lines.map(L => { const e = h("div", "line"); e._at = L.at; e._fn = L.html; e._last = ""; aside.append(e); return e; });
  aside.update = step => els.forEach(e => {
    const html = e._fn();
    if (html !== e._last) { e.innerHTML = html; if (e._last && e.classList.contains("on")) { e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); } e._last = html; }
    e.classList.toggle("on", step >= e._at);
    e.classList.toggle("cur", step === e._at);
  });
  const prevUpdate = aside.update;
  aside.update = step => { prevUpdate(step); clearTimeout(aside._t); aside._t = setTimeout(() => { const c = aside.querySelector(".line.cur") || [...aside.querySelectorAll(".line.on")].pop(); if (c) c.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 480); };
  return aside;
}
const ctl = (parent, html) => { const l = h("label", null, html); parent.append(l); return l; };
const btn = (parent, text, fn) => { const b = h("button", null, text); b.onclick = fn; parent.append(b); return b; };
/* ---- math typography + motion helpers ---- */
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const sig = (top, bot) => `<span class="sumop"><span>${top}</span><b>&Sigma;</b><span>${bot}</span></span>`;
const tm = (a, b, html, k) => `<span class="term" data-a="${a}" data-b="${b}"${k ? ` data-k="${k}"` : ""}>${html}</span>`;
function mkStrip(html, cls = "") {
  const d = h("div", "fstrip " + cls); d.innerHTML = html;
  d.upd = st => $$(".term", d).forEach(t => { const a = +t.dataset.a, b = +t.dataset.b; t.classList.toggle("cur", st >= a && st <= b); t.classList.toggle("seen", st > b); });
  return d;
}
/* number that glides to its new value */
function tween(el, to, f = v => fmt(v, 0), dur = 650) {
  const from = el._v == null ? to : el._v; el._v = to; cancelAnimationFrame(el._r);
  const t0 = performance.now();
  const stepf = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(from + (to - from) * e); if (k < 1) el._r = requestAnimationFrame(stepf); };
  stepf(t0);
}
function animDot(dot, pts, dur) {
  cancelAnimationFrame(animDot.r); const lens = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); lens.push(l); tot += l; }
  const t0 = performance.now();
  const f = t => { let k = Math.min(1, (t - t0) / dur); k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; let d = k * tot, i = 0; while (i < lens.length - 1 && d > lens[i]) { d -= lens[i]; i++; } const u = lens[i] ? d / lens[i] : 0; dot.setAttribute("cx", pts[i][0] + (pts[i + 1][0] - pts[i][0]) * u); dot.setAttribute("cy", pts[i][1] + (pts[i + 1][1] - pts[i][1]) * u); if (k < 1) animDot.r = requestAnimationFrame(f); else dot.remove(); };
  f(t0);
}

/* =========================================================
   Shared state (rows of the data hall)
   ========================================================= */
const S = { P: [300, 250, 400, 350, 200, 500, 150, 450], b1: 3, b2: 6, n: 4, t: null };
const R = S.P.length, G = 3;
const UNITS = n => "ABCDEF".slice(0, n).split("");
const subsetsOf = (units, k) => { const out = []; (function rec(st, cur) { if (cur.length === k) { out.push(cur.join("")); return; } for (let i = st; i < units.length; i++) rec(i + 1, [...cur, units[i]]); })(0, []); return out; };
/* identical to _build_coeff_table() in engine/optimization.py */
const coeff = (sub, f, u) => { const mem = sub.split(""); if (u === f || !mem.includes(u)) return 0; return mem.includes(f) ? 1 / (mem.length - 1) : 1 / mem.length; };
const groupRows = () => [S.P.slice(0, S.b1), S.P.slice(S.b1, S.b2), S.P.slice(S.b2)];
const sum = a => a.reduce((x, y) => x + y, 0);

/* =========================================================
   MODULE 1 - Search space
   ========================================================= */
const A = (() => {
  const Q = { R: 24, G: 4, n: 4 };
  let step = 0, free = [], cuts = [], blocks = [];
  const reshuffle = () => {
    free = Array.from({ length: Q.R }, () => Math.floor(Math.random() * Q.G));
    const set = new Set(); while (set.size < Q.G - 1) set.add(1 + Math.floor(Math.random() * (Q.R - 1)));
    cuts = [...set].sort((a, b) => a - b);
  };
  reshuffle();
  const row = h("div", "blocksrow");
  const bars = h("div");
  const stage = h("div", "stage top"); stage.append(h("div", "note", "Each block is one row of racks (a HAC row). Colour = which group it belongs to."), row, bars);
  const rebuild = () => { row.replaceChildren(); blocks = Array.from({ length: Q.R }, (_, i) => { const b = h("div", "bk", i + 1); b.style.transitionDelay = (i * 18) + "ms"; row.append(b); return b; }); };
  const defs = [
    { at: 0, c: "#fb7185" }, { at: 1, c: "#2dd4bf" }, { at: 2, c: "#60a5fa" }, { at: 3, c: "#f5a524" },
  ];
  const barEls = defs.map(d => { const e = h("div", "lbar", '<div class="t"></div><div class="tr"><div></div></div><div class="num"></div>'); e.style.setProperty("--c", d.c); $(".tr div", e).style.background = d.c; bars.append(e); return e; });
  bars.append(h("div", "small", "Bars use a log scale (width = number of digits)."));

  const ctrls = h("div", "controls");
  const rr = ctl(ctrls, 'Rows <b>R</b> <input type="range" min="6" max="48" value="24"> <output></output>');
  const gg = ctl(ctrls, 'Groups <b>G</b> <input type="range" min="2" max="8" value="4"> <output></output>');
  const nn = ctl(ctrls, 'UPS per group <select><option>4</option><option>5</option><option>6</option></select>');
  $("input", rr).oninput = e => { Q.R = +e.target.value; reshuffle(); rebuild(); update(step); };
  $("input", gg).oninput = e => { Q.G = +e.target.value; reshuffle(); update(step); };
  $("select", nn).onchange = e => { Q.n = +e.target.value; update(step); };
  btn(ctrls, "Shuffle", () => { reshuffle(); update(step); });
  const wrap = h("div", "stagewrap"); wrap.append(stage, ctrls);

  const strip = mkStrip(
    tm(0, 0, `G<sup>R</sup> = m<sup>n</sup>`) +
    tm(1, 1, `C(R&minus;1, G&minus;1) = ${fr("(R&minus;1)!", "(G&minus;1)!&thinsp;(R&minus;G)!")}`) +
    tm(2, 2, `C(n, 2)<sup>R</sup>`) +
    tm(3, 3, `N = C(R&minus;1, G&minus;1) &middot; C(n, 2)<sup>R</sup>`));

  const nums = () => {
    const freeN = BigInt(Q.G) ** BigInt(Q.R), contN = comb(Q.R - 1, Q.G - 1), pr = BigInt(Q.n * (Q.n - 1) / 2), prN = pr ** BigInt(Q.R);
    return { freeN, contN, pr, prN, freeAll: freeN * prN, contAll: contN * prN };
  };
  const panel = makePanel("How big is the search?", "Why we cannot just try every grouping.", [
    { at: 0, html: () => { const k = nums(); return `If any row can go to any group, each of the <span class="v">R = ${Q.R}</span> rows has <span class="v">G = ${Q.G}</span> choices:<br><span class="f">G<sup>R</sup> = ${Q.G}<sup>${Q.R}</sup></span> = <span class="big">${fmtBig(k.freeN)}</span><span class="note">(this is the m<sup>n</sup> growth)</span>`; } },

    { at: 2, html: () => { const k = nums(); return `But each row also picks <b>which UPS pair</b> it plugs into: C(${Q.n}, 2) = <span class="v">${k.pr}</span> choices per 2-source row.<br><span class="f">${k.pr}<sup>${Q.R}</sup></span> = <span class="v">${fmtBig(k.prN)}</span> pairings.<br><span class="note">The code's brute-force check stops at 2,000,000 combinations.</span>`; } },

  ]);

    blocks.forEach((b, i) => {
      const g = st >= 1 ? cont[i] : free[i];

    const k = nums();
    const items = [
      { t: `<b>Free</b> grouping &nbsp;G<sup>R</sup>`, v: log10Big(k.freeN), n: fmtBig(k.freeN) },
      { t: `<b>Contiguous</b> &nbsp;C(R&minus;1,G&minus;1)`, v: log10Big(k.contN) || 0, n: fmtBig(k.contN) },
      { t: `<b>Pairing</b> &nbsp;${k.pr}<sup>R</sup>`, v: log10Big(k.prN), n: fmtBig(k.prN) },
      { t: `<b>Contiguous &times; pairing</b>`, v: log10Big(k.contAll), n: fmtBig(k.contAll) },

    const mx = Math.max(...items.map(i => i.v), 1) * 1.02;

})();

/* =========================================================
   MODULE 2 - t -> y -> P
   ========================================================= */
const B = (() => {
  let step = 0;
  const mkT = () => S.P.map((_, i) => [i < S.b1 ? 1 : 0, i < S.b2 ? 1 : 0]);
  S.t = mkT();
  const tget = (i, g) => g === 0 ? 0 : g === G ? 1 : S.t[i][g - 1];
  const yget = (i, g) => tget(i, g) - tget(i, g - 1);
  function viol() {
    const v = new Set(), msgs = [];
    for (let g = 1; g < G; g++) for (let i = 0; i < R - 1; i++) if (tget(i, g) < tget(i + 1, g)) { v.add(i + "," + g); v.add((i + 1) + "," + g); msgs.push(`t[${i + 1},${g}] = 0 but t[${i + 2},${g}] = 1 &rarr; breaks t[i,g] &ge; t[i+1,g]`); }

  tbl.append(head);

    tr.append(h("td", "lab", "R" + (i + 1)));
    const kt = h("td", "kw"); o.bar = h("div", "kwbar"); kt.append(o.bar); tr.append(kt);
    for (let g = 1; g < G; g++) { const td = h("td"); td._col = 1; td.onclick = () => { if (step < 1) return; S.t[i][g - 1] ^= 1; update(step); }; tr.append(td); o.t.push(td); }
    const sp = h("td", "sep"); sp._col = 3; tr.append(sp);
    for (let g = 1; g <= G; g++) { const td = h("td"); td._col = 3; tr.append(td); o.y.push(td); }

  $$("td", foot).forEach(c => c._col = 4);

  const strip = mkStrip(tm(0, 0, `P<sub>i</sub>`) + tm(1, 1, `t<sub>i,g</sub> &isin; {0,1}`) + tm(2, 2, `t<sub>i,g</sub> &ge; t<sub>i+1,g</sub>&emsp;t<sub>i,g</sub> &le; t<sub>i,g+1</sub>`) + tm(3, 3, `y<sub>i,g</sub> = t<sub>i,g</sub> &minus; t<sub>i,g&minus;1</sub>`) + tm(4, 4, `P<sub>g</sub> = ${sig("R", "i=1")} y<sub>i,g</sub> &middot; P<sub>i</sub>`));

  const ctrls = h("div", "controls");
  const c1 = ctl(ctrls, 'Cut 1 after row <input type="range" min="1" max="6" value="3"> <output></output>');
  const c2 = ctl(ctrls, 'Cut 2 after row <input type="range" min="2" max="7" value="6"> <output></output>');
  $("input", c1).oninput = e => { S.b1 = +e.target.value; if (S.b2 <= S.b1) S.b2 = S.b1 + 1; S.t = mkT(); update(step); };
  $("input", c2).oninput = e => { S.b2 = +e.target.value; if (S.b1 >= S.b2) S.b1 = S.b2 - 1; S.t = mkT(); update(step); };
  btn(ctrls, "Reset t", () => { S.t = mkT(); update(step); });
  btn(ctrls, "Balance cuts", () => {

    S.b1 = bb[0]; S.b2 = bb[1]; S.t = mkT(); update(step);
  });
  btn(ctrls, "Random kW", () => { S.P = S.P.map(() => 100 + 50 * Math.floor(Math.random() * 9)); update(step); });
  const wrap = h("div", "stagewrap"); wrap.append(stage, ctrls);

  const Pg = () => [0, 1, 2].map(g => S.P.reduce((a, p, i) => a + yget(i, g + 1) * p, 0));
  const panel = makePanel("From cut lines to equations", "Binary t makes 'adjacent rows only' a linear constraint.", [
    { at: 0, html: () => `Each row <i>i</i> has load <span class="f">P<sub>i</sub></span>. Total = <span class="v">${sum(S.P)} kW</span>, to be split into <span class="v">G = ${G}</span> groups.` },
    { at: 1, html: () => `Binary variable <span class="f">t[i,g] = 1</span> when <b>row i is in a group &le; g</b>.<br>Fixed: t[i,0] = 0 and t[i,G] = 1.<br><span class="note">Each column is a staircase of 1s on top, 0s below. The cut line is where the 1s stop. <b>Click a t cell</b> to break it.</span>` },
    { at: 2, html: () => { const { msgs } = viol(); return `Two linear rules keep groups contiguous:<br><span class="f">t[i,g] &ge; t[i+1,g]</span> (no gaps in a column)<br><span class="f">t[i,g] &le; t[i,g+1]</span> (group &le; g sits inside group &le; g+1)<br>` + (msgs.length ? `<span style="color:var(--rose)">${msgs.slice(0, 3).join("<br>")}</span>` : `<span style="color:var(--teal)">&#10003; all rules satisfied: every group is one block of adjacent rows</span>`); } },
    { at: 3, html: () => `Row <i>i</i> is in group exactly <i>g</i> when it is in &le; g but not &le; g&minus;1:<br><span class="f">y[i,g] = t[i,g] &minus; t[i,g&minus;1]</span><br><span class="note">e.g. row 1: y = ${[1, 2, 3].map(g => yget(0, g)).join(", ")} &nbsp; &mdash; exactly one 1 per row.</span>` },
    { at: 4, html: () => { const p = Pg(); return `Group load is a plain sum:<br><span class="f">P<sub>g</sub> = &Sigma; y[i,g] &middot; P<sub>i</sub></span><br>` + p.map((v, g) => `<span class="dot" style="background:${COLORS[g]}"></span>P<sub>${g + 1}</sub> = <span class="v">${fmt(v, 0)} kW</span>`).join("<br>") + `<br><span class="note">${comb(R - 1, G - 1)} valid cut choices exist for these ${R} rows.</span>`; } },

    $$("th,td", tbl).forEach(c => { const col = c._col; if (col === undefined) return; c.classList.toggle("hid", st < (col === 4 ? 4 : col)); });
    panel.update(st);
  }
  return { id: "cuts", name: "Cuts: t, y, P", steps: ["Rows & kW", "Variable t", "Constraints", "y = t - t'", "P per group"], nodes: [strip, wrap, panel], update: st => { update(st); strip.upd(st); } };
})();

/* =========================================================
   MODULE 3 - failure coefficients c[s,f,u]   (UPS on top, rows below)
   ========================================================= */
const C = (() => {
  const rows = [{ kw: 300, sub: "AB" }, { kw: 250, sub: "CD" }, { kw: 400, sub: "AC" }];
  let f = "A", step = 0, builtN = 0, E = null;
  const units = () => UNITS(S.n);
  const loads = fault => { const L = {}; units().forEach(u => L[u] = 0); rows.forEach(r => units().forEach(u => { L[u] += fault ? r.kw * coeff(r.sub, fault, u) : (r.sub.includes(u) ? r.kw / r.sub.length : 0); })); if (fault) L[fault] = 0; return L; };
  const matrix = () => units().map(ff => units().map(u => ff === u ? null : rows.reduce((a, r) => a + r.kw * coeff(r.sub, ff, u), 0)));

  const W = 780, H = 300, UW = 104, UH = 78, uy = 10, RW = 176, RH = 52, ry = H - RH - 12;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-height:250px" });
  const stage = h("div", "stage top"); const heatWrap = h("div", "heatwrap"); stage.append(svg, heatWrap);

  function build() {
    const us = units(), n = us.length; builtN = n; svg.replaceChildren();
    const ux = k => 70 + k * ((W - 140) / (n - 1)), rx = i => W * (i + .5) / 3 - RW / 2;
    E = { links: [], ups: [], rows: [], heat: [] };
    rows.forEach((r, i) => us.forEach((u, k) => {
      const x1 = ux(k), y1 = uy + UH, x2 = rx(i) + RW / 2, y2 = ry;
      const g = s("g", { class: "lk" }, svg);
      const line = s("line", { x1, y1, x2, y2 }, g);
      const dot = s("circle", { r: 5, fill: "#f5a524" }, g); s("animateMotion", { dur: "1.5s", repeatCount: "indefinite", path: `M${x1},${y1} L${x2},${y2}` }, dot);
      const lx = x1 + (x2 - x1) * .66, ly = y1 + (y2 - y1) * .66;
      const lg = s("g", { class: "lbl" }, g); s("rect", { x: lx - 22, y: ly - 11, width: 44, height: 20, rx: 6 }, lg);
      const tx = s("text", { x: lx, y: ly + 4, "text-anchor": "middle" }, lg);
      E.links.push({ i, u, line, dot, lg, tx, rect: $("rect", lg) });
    }));
    us.forEach((u, k) => {
      const g = s("g", { class: "ups", style: "cursor:pointer" }, svg), x = ux(k) - UW / 2;
      const box = s("rect", { x, y: uy, width: UW, height: UH, rx: 11 }, g);
      const bar = s("rect", { x: x + 7, y: uy + UH - 7, width: UW - 14, height: 0, rx: 5, class: "ubar" }, g);
      const nm = s("text", { x: ux(k), y: uy + 22, "text-anchor": "middle", "font-size": 17, "font-weight": 700 }, g);
      const kw = s("text", { x: ux(k), y: uy + 50, "text-anchor": "middle", "font-size": 18, "font-weight": 700, "font-family": "ui-monospace,monospace" }, g);
      g.onclick = () => { if (step >= 1) { f = u; update(step); } };
      E.ups.push({ u, g, box, bar, nm, kw });
    });
    rows.forEach((r, i) => {
      const g = s("g", {}, svg), x = rx(i);
      s("rect", { x, y: ry, width: RW, height: RH, rx: 10, fill: "#171a1f", stroke: COLORS[i], "stroke-width": 2 }, g);
      s("text", { x: x + RW / 2, y: ry + 25, fill: "#e8eaed", "font-size": 15, "font-weight": 700, "text-anchor": "middle" }, g).textContent = `Row ${i + 1}: ${r.kw} kW`;
      E.rows.push({ sub: s("text", { x: x + RW / 2, y: ry + 45, fill: "#8b919c", "font-size": 12, "text-anchor": "middle" }, g) });
    });
    // heat table
    heatWrap.replaceChildren(); const t = h("table", "mat heat");
    t.append(h("tr", null, `<th>f fails &#8595; &nbsp; load on u &#8594;</th>` + us.map(u => `<th>${u}</th>`).join("")));
    us.forEach((ff, a) => { const tr = h("tr"); tr.append(h("td", "lab", "f = " + ff)); const cells = us.map(() => { const td = h("td"); tr.append(td); return td; }); tr.onclick = () => { f = ff; update(step); }; tr.style.cursor = "pointer"; t.append(tr); E.heat.push(cells); });
    heatWrap.append(t);
  }

  const ctrls = h("div", "controls");
  const subs = () => [...subsetsOf(units(), 2), ...subsetsOf(units(), 4)];
  const sels = rows.map((r, i) => { const l = ctl(ctrls, `Row ${i + 1} (${r.kw} kW) plugs into <select></select>`); const se = $("select", l); const fill = () => { se.replaceChildren(); subs().forEach(x => se.append(new Option((x.length === 2 ? "2-src " : "4-src ") + x, x))); se.value = r.sub; }; fill(); se.onchange = () => { r.sub = se.value; update(step); }; return { fill }; });
  ctl(ctrls, 'UPS in group <select><option>4</option><option>5</option><option>6</option></select>').querySelector("select").onchange = e => { S.n = +e.target.value; if (!units().includes(f)) f = "A"; sels.forEach(x => x.fill()); rows.forEach(r => { if (!subs().includes(r.sub)) r.sub = "AB"; }); update(step); };
  const wrap = h("div", "stagewrap"); wrap.append(stage, ctrls);

  const strip = mkStrip(
    tm(0, 0, `c = ${fr("1", "|s|")}`) +
    tm(1, 1, `c<sub>s,f,u</sub> = <span class="cases"><span class="brace">{</span><span class="cb"><span>${fr("1", "|s|&minus;1")}&ensp;f&isin;s, u&isin;s, u&ne;f</span><span>${fr("1", "|s|")}&ensp;f&notin;s, u&isin;s</span><span>0&ensp;otherwise</span></span></span>`) +
    tm(2, 2, `L<sub>f,u</sub> = ${sig("", "rows i")} kW<sub>i</sub> &middot; c<sub>s<sub>i</sub>,f,u</sub>`) +
    tm(3, 3, `max<sub>f</sub> max<sub>u&ne;f</sub> L<sub>f,u</sub>`), "small");

  const panel = makePanel("What happens when one UPS fails", "Coefficient c[s,f,u]: the share of a row's kW that lands on UPS u.", [
    { at: 0, html: () => `A row plugs into a subset <span class="f">s</span> of the group's UPS (2 for 2-source, 4 for 4-source). Normally it shares its kW equally: <span class="f">c = 1/|s|</span>.<br><span class="note">${rows.map((r, i) => `Row ${i + 1}: ${r.kw} kW on ${r.sub} &rarr; ${fmt(r.kw / r.sub.length, 0)} each`).join("<br>")}</span>` },
    { at: 1, html: () => `UPS <span class="v">${f}</span> fails (click any UPS to change). Rows plugged into it re-share among the <b>survivors</b>: <span class="f">1/(|s|&minus;1)</span> each. Rows not plugged into it are unchanged.` },
    { at: 2, html: () => `Try every failure f. Cell [f,u] = load on u when f fails. Click a row to preview that failure.<br><span class="note">Total checks: n&times;(n&minus;1) = ${S.n * (S.n - 1)} cells per group.</span>` },
    { at: 3, html: () => { const m = matrix().flat().filter(x => x != null); return `The group's <b>max-fail load</b> is the biggest cell:<br><span class="f">max<sub>f</sub> max<sub>u&ne;f</sub> &Sigma; kW &middot; c[s,f,u]</span><br><span class="big">= ${fmt(Math.max(...m), 1)} kW</span><br><span class="note">This is what evaluate_group_max_fail() returns, and what the optimiser pushes down.</span>`; } },
  ]);

  function update(st) {
    step = st; if (builtN !== S.n) build();
    const us = units(), fault = st >= 1 ? f : null, L = loads(fault), mx = Math.max(...Object.values(L), 1);
    E.links.forEach(lk => {
      const r = rows[lk.i], member = r.sub.includes(lk.u), dead = fault === lk.u, affected = fault && r.sub.includes(fault);
      const share = fault ? (r.sub.includes(fault) ? (dead ? 0 : 1 / (r.sub.length - 1)) : 1 / r.sub.length) : 1 / r.sub.length;
      const col = dead ? "#fb7185" : affected ? "#f5a524" : COLORS[lk.i];
      lk.line.style.opacity = member ? (dead ? .75 : .8) : 0; lk.line.style.stroke = col; lk.line.style.strokeWidth = dead ? 2 : 2 + share * 8; lk.line.style.strokeDasharray = dead ? "5 5" : "none";
      lk.dot.style.opacity = member && !dead ? 1 : 0; lk.dot.style.fill = col;
      lk.lg.style.opacity = member && !dead ? 1 : 0; lk.tx.textContent = fmt(share, 2); lk.tx.style.fill = affected ? "#f5a524" : "#8b919c"; lk.rect.style.stroke = affected ? "#f5a524" : "#333843";
    });
    E.ups.forEach(o => {
      const dead = fault === o.u;
      o.g.classList.toggle("dead", dead);
      o.nm.textContent = "UPS " + o.u + (dead ? "  ✕" : ""); o.nm.style.fill = dead ? "#fb7185" : "#e8eaed";
      o.kw.style.fill = dead ? "#fb7185" : "#f5a524";
      if (dead) { o.kw._v = null; o.kw.textContent = "FAILED"; } else tween(o.kw, L[o.u], v => fmt(v, 0) + " kW");
      const bh = dead ? 0 : 36 * L[o.u] / mx; o.bar.style.height = bh + "px"; o.bar.style.y = (uy + UH - 7 - bh) + "px";
    });
    E.rows.forEach((o, i) => o.sub.textContent = `s = ${rows[i].sub}  (|s| = ${rows[i].sub.length})`);
    heatWrap.classList.toggle("on", st >= 2);
    if (st >= 2) {
      const M = matrix(), mxv = Math.max(...M.flat().filter(x => x != null));
      M.forEach((r, a) => r.forEach((v, b) => {
        const td = E.heat[a][b]; td.className = v == null ? "diag" : (st >= 3 && Math.abs(v - mxv) < 1e-9 ? "max" : "");
        if (v == null) { td.textContent = "-"; td.style.background = ""; } else { td.textContent = fmt(v, 0); td.style.background = `rgba(245,165,36,${.08 + .55 * v / mxv})`; td.style.color = "#e8eaed"; }
        if (us[a] === f) td.style.boxShadow = "inset 0 0 0 1px rgba(255,255,255,.18)"; else td.style.boxShadow = "";
      }));
    }
    strip.upd(st); panel.update(st);
  }
  return { id: "fail", name: "Failure c[s,f,u]", steps: ["Normal share", "One UPS fails", "Try every f", "Max-fail load"], nodes: [strip, wrap, panel], update };
})();

/* =========================================================
   MODULE 4 - objective: minimize M
   ========================================================= */
const D = (() => {

    tm(3, 3, `L<sub>g,u</sub> = ${sig("", "i,p&ni;u")} ${fr("kW<sub>i</sub>", "|p|")} q<sub>i,g,p</sub>`) + tm(4, 4, `L<sub>g,f,u</sub> = ${sig("", "i,p")} c<sub>p,f,u</sub> &middot; kW<sub>i</sub> &middot; q<sub>i,g,p</sub>`));

  const panel = makePanel("Which UPS pair does each row use?", "Binary q[i,g,p]: one pair per row, chosen after the groups are fixed.", [
    { at: 0, html: () => `After the cuts, every row belongs to one group (colour). That group has 4 UPS (A&ndash;D). The question now: <b>which UPS feed each row?</b>` },
    { at: 1, html: () => `A 2-source row plugs into <b>2 of the 4 UPS</b>: C(4,2) = 6 pairs. Binary <span class="f">q[i,g,p] = 1</span> means "row i, in group g, uses pair p". A 4-source row plugs into all four (ABCD). <b>Click any cell</b> to choose.` },
    { at: 2, html: () => `Each row uses exactly one pair: <span class="f">&Sigma;<sub>p</sub> q[i,g,p] = y[i,g]</span>.<br>The row's own group has y = 1, so one q is 1. Every other group has y = 0, so all its q are 0. <span class="note">${combos().toLocaleString("en-US")} pairing combinations for this layout.</span>` },
    { at: 3, html: () => `Normally a row shares its kW equally across its pair, so each UPS carries the sum of its halves. Bars show the load on each UPS, per group.` },
    { at: 4, html: () => { const m = [0, 1, 2].map(maxFail), M = Math.max(...m); return `UPS <span class="v">${f}</span> fails (click a chip). Its rows move to their partner: <span class="f">c = 1/(|s|&minus;1)</span>.<br>Worst case per group: ${m.map((v, g) => `<span class="dot" style="background:${COLORS[g]}"></span>${fmt(v, 0)}`).join(" &nbsp; ")} kW &rarr; <b>M = ${fmt(M, 0)} kW</b>.<br><span class="note">Try "All rows on AB" versus "Best pairing".</span>`; } },
  ]);

  function update(st) {
    step = st;
    rowEl.forEach((o, i) => {
      const g = grpOf(i);
      o.grp.innerHTML = `<span class="dot" style="background:${COLORS[g]}"></span>G${g + 1}`; o.grp.className = "gcell";
      o.src.textContent = S.src[i] === 4 ? "4-src" : "2-src"; o.src.className = "srccell";
      o.cells.forEach((td, k) => {
        const col = COLS[k], valid = (col === QUAD) === (S.src[i] === 4), on = S.pair[i] === col && valid;
        td.textContent = on ? 1 : valid ? 0 : ""; td.className = on ? "t1" : valid ? "t0" : "na";
        if (on) { td.style.background = COLORS[g] + "33"; td.style.color = COLORS[g]; } else { td.style.background = ""; td.style.color = ""; }
      });
      o.sum.textContent = "1"; o.sum.className = "qsum";
    });
    // reveal columns by step
    $$("tr", tbl).forEach(tr => [...tr.children].forEach((c, k) => { const q = k >= 4 && k <= 10, extra = k === 11; c.classList.toggle("hid", (k === 2 && st < 0) || (q && st < 1) || (extra && st < 2) || (k === 3 && st < 1)); }));
    chips.classList.toggle("on", st >= 4);
    chipEls.forEach((b, k) => b.classList.toggle("on", U[k] === f));
    const showBars = st >= 3, fault = st >= 4 ? f : null;
    const all = [0, 1, 2].map(g => loadsGroup(g, fault)), mxv = Math.max(1, ...all.map(L => Math.max(...Object.values(L))));
    cards.forEach((cd, g) => {
      cd.c.classList.toggle("on", showBars);
      const L = all[g]; cd.gt.innerHTML = `Group ${g + 1} &middot; ${rowsOf(g).length} rows &middot; ${sum(rowsOf(g).map(o => o.kw))} kW`;
      U.forEach((u, k) => { const c = cd.cols[k], dead = fault === u; c.col.classList.toggle("dead", dead); c.bar.style.height = dead ? "6px" : (L[u] / mxv * 100) + "%"; c.val.textContent = dead ? "✕" : fmt(L[u], 0); });
      cd.mf.innerHTML = st >= 4 ? `worst case over any failure: <b style="color:var(--amber)">${fmt(maxFail(g), 0)} kW</b>` : "";
    });
    const M = Math.max(...[0, 1, 2].map(maxFail));
    msum.classList.toggle("on", st >= 4); msum.innerHTML = `M = max over groups = <b>${fmt(M, 0)} kW</b>`;
    strip.upd(st); panel.update(st);
  }
  return { id: "pairing", name: "Pairing q", steps: ["Rows & groups", "Binary q", "One pair per row", "Normal load", "UPS fails"], nodes: [strip, wrap, panel], update };
})();

// keep the dots refreshed after "New rows"
const MODS = [A, B, PM, C, D, E, F];
let mi = 0, st = 0;
const nav = $("#nav"), main = $("#main"), dots = $("#dots");
MODS.forEach((m, i) => {
  const b = h("button", null, `<b>${i + 1}</b>${m.name}`); b.onclick = () => go(i, 0); nav.append(b); m.btn = b;
  m.root = h("section", "module"); m.root.append(...m.nodes); main.append(m.root);
});
function go(i, s0) {
  mi = i; st = s0; const m = MODS[mi];
  MODS.forEach(x => { x.root.classList.toggle("on", x === m); x.btn.classList.toggle("on", x === m); });
  dots.classList.toggle("many", m.steps.length > 10);
  dots.replaceChildren(...m.steps.map((t, k) => { const d = h("span", null, `${k + 1}. ${t}`); if (m.steps.length > 8) d.textContent = t; d.onclick = () => go(mi, k); d.className = k < st ? "done" : k === st ? "cur" : ""; return d; }));
  m.update(st);
  history.replaceState(null, "", `#${m.id}-${st}`);
}
function next() { const m = MODS[mi]; if (st < m.steps.length - 1) go(mi, st + 1); else if (mi < MODS.length - 1) go(mi + 1, 0); }
function prev() { if (st > 0) go(mi, st - 1); else if (mi > 0) go(mi - 1, MODS[mi - 1].steps.length - 1); }
$("#next").onclick = next; $("#prev").onclick = prev;
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") { if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return; e.target.blur(); }
  if (e.key === "ArrowRight" || e.key === "PageDown") next();
  else if (e.key === "ArrowLeft" || e.key === "PageUp") prev();
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); next(); }
  else if (/^[1-7]$/.test(e.key)) go(+e.key - 1, 0);
  else if (e.key.toLowerCase() === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
MODS.forEach(m => m.update(0));
const hm = location.hash.match(/#(\w+)-(\d+)/), start = hm ? MODS.findIndex(m => m.id === hm[1]) : -1;
start >= 0 ? go(start, Math.min(+hm[2], MODS[start].steps.length - 1)) : go(0, 0);

/* ---- focus / present mode ---- */
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600); }
function setPresent(on) {
  document.body.classList.toggle("present", on);
  if (on) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); toast("Present mode  |  arrows: step  |  P: exit  |  C: controls"); }
  else if (document.fullscreenElement) document.exitFullscreen();
}
$("#prbtn").onclick = () => setPresent(!document.body.classList.contains("present"));
$("#ctlbtn").onclick = () => document.body.classList.toggle("ctl");
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("present"); });
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (k === "p") setPresent(!document.body.classList.contains("present"));
  else if (k === "c") document.body.classList.toggle("ctl");
});


function fit() { const z = Math.max(0.85, Math.min(1.7, innerWidth / 1440, innerHeight / 820)); document.documentElement.style.zoom = Math.abs(z - 1) < 0.03 ? '' : z; }
addEventListener('resize', fit); fit();
</script>
